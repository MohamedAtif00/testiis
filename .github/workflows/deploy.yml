name: Deploy to IIS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: [self-hosted, Windows]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Deploy to IIS
        shell: pwsh
        env:
          DEPLOY_BACKEND_PATH: ${{ vars.DEPLOY_BACKEND_PATH }}
          DEPLOY_FRONTEND_PATH: ${{ vars.DEPLOY_FRONTEND_PATH }}
          PRODUCTION_API_URL: ${{ vars.PRODUCTION_API_URL }}
          PRODUCTION_FRONTEND_ORIGIN: ${{ vars.PRODUCTION_FRONTEND_ORIGIN }}
          IIS_API_APP_POOL: ${{ vars.IIS_API_APP_POOL }}
          IIS_UI_APP_POOL: ${{ vars.IIS_UI_APP_POOL }}
        run: ./deploy.ps1
